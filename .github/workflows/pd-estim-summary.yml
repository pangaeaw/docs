name: Daily PD Estim Summary

"on":
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Query issues and update Results.md
        uses: actions/github-script@v7
        env:
          NODE_OPTIONS: --experimental-vm-modules
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── 1. Fetch all open issues (paginated) ─────────────────────
            let issues = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: "open",
                per_page: 100,
                page,
              });
              if (data.length === 0) break;
              issues = issues.concat(data.filter(i => !i.pull_request));
              page++;
            }

            console.log(`Total open issues fetched: ${issues.length}`);

            // ── 2. Parse PD estim, issue type and quarter from body/issue ─
            const pdRegex = /PDestim\s*:\s*([\d.]+)/i;
            const typeRegex = /CustomType\s*:\s*(.+)/i;

            const getQuarter = (dateStr) => {
              const date = new Date(dateStr);
              const q = Math.ceil((date.getMonth() + 1) / 3);
              const year = date.getFullYear();
              return `Q${q} ${year}`;
            };

            // quarterTypeTotals = { "Q1 2026": { "Bug": 3.5, "Feature": 2.0 }, ... }
            const quarterTypeTotals = {};
            let grandTotal = 0;
            let counted = 0;
            let skipped = 0;

            for (const issue of issues) {
              const body = issue.body ?? "";

              const pdMatch = body.match(pdRegex);
              const typeMatch = body.match(typeRegex);

              const pd = pdMatch ? parseFloat(pdMatch[1]) : null;
              const issueType = typeMatch
                ? typeMatch[1].trim().split("\n")[0].trim()
                : "_(unset)_";

              if (pd === null) {
                skipped++;
                console.log(`Issue #${issue.number} skipped — no PDestim found`);
                continue;
              }

              const quarter = getQuarter(issue.created_at);

              counted++;
              grandTotal += pd;

              if (!quarterTypeTotals[quarter]) quarterTypeTotals[quarter] = {};
              quarterTypeTotals[quarter][issueType] =
                (quarterTypeTotals[quarter][issueType] ?? 0) + pd;
            }

            console.log(`Issues counted: ${counted}, skipped (no PDestim): ${skipped}`);

            // ── 3. Build the markdown section ─────────────────────────────
            const now = new Date();

            const tzLabel = now.toLocaleString("en-GB", {
              timeZone: "Europe/Zurich",
              timeZoneName: "short"
            }).split(" ").pop(); // extracts "CET" or "CEST"

            const dateStr = now.toLocaleString("en-GB", {
              timeZone: "Europe/Zurich",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).replace(",", "") + ` ${tzLabel}`;

            const sortedQuarters = Object.keys(quarterTypeTotals).sort((a, b) => {
              const [qa, ya] = a.split(" ");
              const [qb, yb] = b.split(" ");
              return ya !== yb
                ? parseInt(ya) - parseInt(yb)
                : parseInt(qa[1]) - parseInt(qb[1]);
            });

            let quarterSections = [];
            for (const quarter of sortedQuarters) {
              const typeTotals = quarterTypeTotals[quarter];
              const sortedTypes = Object.entries(typeTotals).sort((a, b) => b[1] - a[1]);
              const quarterTotal = sortedTypes.reduce((sum, [, v]) => sum + v, 0);

              const rows = sortedTypes
                .map(([type, total]) => `| ${type} | ${total.toFixed(1)} |`)
                .join("\n");

              quarterSections.push([
                `### ${quarter}`,
                "",
                "| Issue Type | PD Estim (days) |",
                "|------------|-----------------|",
                rows,
                `| **Total** | **${quarterTotal.toFixed(1)}** |`,
                "",
              ].join("\n"));
            }

            const newSection = [
              `## ${dateStr}`,
              "",
              ...quarterSections,
              `> 📝 ${counted} open issue(s) included — ${skipped} had no PDestim value.`,
              "",
            ].join("\n");

            // ── 4. Prepend to Results.md (latest run on top) ──────────────
            const filePath = "Results.md";
            let existing = "";

            if (fs.existsSync(filePath)) {
              existing = fs.readFileSync(filePath, "utf8");
            } else {
              existing = "# PD Estim Summary\n\n";
            }

            const header = "# PD Estim Summary\n\n";
            const bodyWithoutHeader = existing.startsWith(header)
              ? existing.slice(header.length)
              : existing.trimStart();
            const updated = header + newSection + "\n" + bodyWithoutHeader.trimStart();

            fs.writeFileSync(filePath, updated, "utf8");
            console.log("Results.md updated.");

      - name: Commit and push Results.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Results.md
          git diff --cached --quiet || git commit -m "chore: PD estim summary update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
