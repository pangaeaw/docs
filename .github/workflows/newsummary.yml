name: Dependency and Spent Summary

"on":
  issues:
    types: [opened, edited, closed, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract and write newsummary.md
        uses: actions/github-script@v7
        env:
          NODE_OPTIONS: --experimental-vm-modules
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // ── 1. Fetch all open issues (paginated) ──────────────────────
            let issues = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: "open",
                per_page: 100,
                page,
              });
              if (data.length === 0) break;
              issues = issues.concat(data.filter(i => !i.pull_request));
              page++;
            }

            console.log(`Total open issues fetched: ${issues.length}`);

            // ── 2. Parse DEPENDENCY: and SPENT: lines from each issue ─────
            // Matches lines like:
            //   DEPENDENCY: some value
            //   SPENT: 3 days
            //   dependency: value   (case-insensitive)
            const dependencyRegex = /^DEPENDENCY\s*:\s*(.+)$/gim;
            const spentRegex      = /^SPENT\s*:\s*(.+)$/gim;

            const dependencyRows = [];
            const spentRows      = [];

            for (const issue of issues) {
              const body = issue.body ?? "";
              const issueRef  = `[#${issue.number} ${issue.title}](${issue.html_url})`;

